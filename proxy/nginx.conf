# Puerta de entrada del juego (puerto 27016).
#
#  /valve.zip  -> se sirve desde build/ (lo arma el estudio con tus personajes).
#                 "no-cache" + ETag: el navegador lo guarda, pero cada vez que
#                 recargás pregunta si cambió, así ves tus cambios al toque.
#  /           -> todo lo demás (página, motor, señalización WebRTC por
#                 WebSocket) va al contenedor del juego.
#
# El tráfico del juego en sí (WebRTC, puerto 27018) va directo al contenedor.

worker_processes 1;

events {
    worker_connections 512;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    access_log    off;
    sendfile      off;   # archivo que se reemplaza seguido en una carpeta compartida
    gzip          off;   # valve.zip ya está comprimido

    # DNS interno de Docker: resuelve "game" en cada pedido, así el proxy
    # sigue andando aunque el contenedor del juego se reinicie.
    resolver 127.0.0.11 ipv6=off valid=10s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 27016;
        client_max_body_size 1m;

        location = /valve.zip {
            root /srv/build;
            default_type application/zip;
            etag on;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location / {
            set $juego http://game:27016;
            proxy_pass $juego;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-cache" always;
        }
    }
}
