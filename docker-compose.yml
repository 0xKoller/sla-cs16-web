name: cs16-custom

# Tres servicios:
#   game   -> servidor dedicado de CS 1.6 + cliente web (Xash3D en WebAssembly, WebRTC)
#   proxy  -> puerta de entrada web: sirve valve.zip (con tus personajes) y pasa el resto al juego
#   studio -> estudio de personajes, siempre solo en esta compu
#
# Los puertos se publican en BIND_ADDR (127.0.0.1 en modo local: nadie más de la red
# puede entrar). start.sh escribe esos valores en .env.

services:
  game:
    image: ${GAME_IMAGE:-yohimik/cs-web-server@sha256:ce01d36559ae78446baed1032252b87ee9ec639e4f2f2cdbbdcf75d75359a699}
    platform: linux/386
    restart: unless-stopped
    command: ["+map", "${MAPA:-de_dust2}", "+maxplayers", "${MAX_JUGADORES:-12}"]
    environment:
      IP: ${GAME_IP:-127.0.0.1}
      PORT: "27018"
    volumes:
      - ./config/server.cfg:/xashds/cstrike/server.cfg:ro
    expose:
      - "27016"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:27018:27018/udp"
      - "${BIND_ADDR:-127.0.0.1}:27018:27018/tcp"
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536m
    pids_limit: 512

  proxy:
    image: nginx:1.29.1-alpine
    restart: unless-stopped
    depends_on:
      - game
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./build:/srv/build:ro
    ports:
      - "${BIND_ADDR:-127.0.0.1}:27016:27016"
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m

  studio:
    build: ./studio
    pull_policy: build
    restart: unless-stopped
    environment:
      ESTUDIO_URL_JUEGO: "${URL_JUEGO:-http://localhost:27016}"
    volumes:
      - ./build:/data/build
      - ./texturas:/data/texturas
    ports:
      - "127.0.0.1:27080:8080"   # el estudio nunca se expone a la red
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
