name: cs16-custom

# Servicios:
#   servidor -> servidor dedicado de CS 1.6 (Xash3D FWGS + ReGameDLL + bots YaPB), Linux 32 bits
#   web      -> página del juego + puente WebRTC <-> UDP (el servidor usa su red)
#               (la carpeta marca/ cambia la página y el juego sin rearmar nada)
#   studio   -> estudio de personajes, siempre solo en esta compu
#   steamcmd -> (solo para bajar los archivos del juego; lo usa start.sh)
#
# Los puertos se publican en BIND_ADDR (127.0.0.1 en modo local: nadie más de la red
# puede entrar). start.sh escribe esos valores en .env.

services:
  servidor:
    build: ./servidor
    platform: linux/amd64   # con bibliotecas de 32 bits: el servidor de CS es i386
    restart: unless-stopped
    environment:
      MAPA: "${MAPA:-de_dust2}"
      MAX_JUGADORES: "${MAX_JUGADORES:-12}"
      BOTS: "${BOTS:-4}"
      BOTS_DIFICULTAD: "${BOTS_DIFICULTAD:-0}"
    volumes:
      - ./build/juego:/juego:ro
      - ./config/server.cfg:/config/server.cfg:ro
      - ./config/mapcycle.txt:/config/mapcycle.txt:ro
      - ./config/motd.txt:/config/motd.txt:ro
    # Comparte la red de "web": así el puente le habla por 127.0.0.1 y cada jugador
    # llega con su propia IP de loopback (el servidor de CS los distingue por IP).
    network_mode: "service:web"
    depends_on:
      - web
    stdin_open: true   # permite escribir en la consola con: docker attach cs16-custom-servidor-1
    tty: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536m
    pids_limit: 512

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:27016:27016/tcp"   # página del juego
      - "${BIND_ADDR:-127.0.0.1}:27018:27018/udp"   # tráfico del juego (WebRTC)
    environment:
      IP_PUBLICA: "${IP_PUBLICA:-127.0.0.1}"
      NOMBRE_SERVIDOR: "${NOMBRE_SERVIDOR:-CS 1.6 propio}"
      MAPA: "${MAPA:-de_dust2}"
      MAX_JUGADORES: "${MAX_JUGADORES:-12}"
      RCON_PASSWORD: "${RCON_PASSWORD:-}"
      DATOS: /data/build
      MARCA: /data/marca/web
    volumes:
      - ./build:/data/build:ro
      - ./marca:/data/marca:ro     # logo, colores y textos de la página: se ven al recargar
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m

  studio:
    build: ./studio
    restart: unless-stopped
    user: "${HOST_UID:-10001:10001}"   # mismo usuario que en tu compu, para escribir en build/ y texturas/
    environment:
      ESTUDIO_URL_JUEGO: "${URL_JUEGO:-http://localhost:27016}"
    volumes:
      - ./build:/data/build
      - ./texturas:/data/texturas
      - ./marca:/data/marca:ro     # marca/juego/* se suma tal cual a valve.zip
    ports:
      - "127.0.0.1:27080:8080"   # el estudio nunca se expone a la red
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g

  steamcmd:
    build: ./steamcmd
    platform: linux/386
    profiles: ["descarga"]
    volumes:
      - ./build/descarga:/descarga
      - steamcmd-cache:/home/steam   # SteamCMD se actualiza solo; así no se baja de nuevo cada vez
    security_opt:
      - no-new-privileges:true

volumes:
  steamcmd-cache:
